<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e6" />
  <meta name="description" content="一页一诗，一诗一画。安静地读唐诗。" />
  <title>唐诗三百首 · 诗画笺</title>
  <link rel="stylesheet" href="./styles.css?v=0.3" />
</head>
<body>
<main class="reader" data-home="true" aria-label="唐诗三百首">
  <section class="home-screen" id="homeScreen" aria-label="唐诗三百首封面">
    <div class="home-art" aria-hidden="true"><img class="home-art-main" src="./assets/optimized/song-yuan-er-page.webp" alt="" /></div>
    <div class="home-copy"><h1>唐诗三百首<span class="home-seal" aria-hidden="true">诗</span></h1><span class="home-kicker">孙洙选本</span><p>熟读唐诗三百首，不会作诗也会吟。</p></div>
    <div class="home-meta"><span id="homeCount">展卷中…</span><span>按原书顺序</span><span>诗画笺读</span></div>
    <div class="home-actions"><button class="home-primary" id="startReading" disabled>入卷</button><button class="home-secondary" id="homeLibrary" disabled>目录</button><button class="home-secondary" id="homeFeatured" disabled>精选</button></div>
    <p id="homeStatus" class="home-status" role="status"></p><button id="retryCatalog" class="retry-button" hidden>重新载入</button>
  </section>
  <div class="reading-surface" id="readingSurface" inert>
    <div class="topbar" id="topbar" data-visible="true">
      <button class="icon-button" id="backHome" aria-label="返回封面">卷</button>
      <div class="top-actions"><button class="text-pill" id="openLibrary">目录</button><button class="icon-button" id="openSettings" aria-label="阅读设置">Aa</button><button class="icon-button seal-button" id="favoriteButton" aria-label="收藏此诗" aria-pressed="false">藏</button></div>
    </div>
    <section class="pages" id="pages" aria-label="诗页，可左右滑动" tabindex="0"></section>
    <button class="reveal-button" id="revealControls" aria-label="显示阅读工具" hidden>· · ·</button>
    <div class="bottombar" id="bottombar" data-visible="true"><div class="page-navigation"><button id="previousPoem" aria-label="上一首">‹</button><span class="page-mark" id="pageMark"></span><button id="nextPoem" aria-label="下一首">›</button></div><button class="text-button" id="toggleNotes" aria-pressed="true">简注</button></div>
  </div>
  <p class="sr-only" id="readerStatus" role="status" aria-live="polite"></p>
  <div class="storage-notice" id="storageNotice" role="status" hidden></div>
</main>
<dialog id="library" class="sheet" aria-labelledby="libraryTitle">
  <div class="sheet-header"><div><span class="library-kicker">诗笺目录</span><h2 id="libraryTitle">一页一诗</h2></div><button class="icon-button" data-close="library" aria-label="关闭目录">×</button></div>
  <label class="search-box"><span class="sr-only">搜索诗名、作者或诗句</span><input id="searchInput" type="search" placeholder="诗名、作者，或记得的一句" autocomplete="off" /><span aria-hidden="true">⌕</span></label>
  <div class="collection-row" role="group" aria-label="诗集范围"><button data-collection="all" aria-pressed="true">全部</button><button data-collection="featured" aria-pressed="false">精选</button><button data-collection="favorites" aria-pressed="false">收藏</button></div>
  <label class="filter-label">分类<select id="categorySelect"><option value="all">全部分类</option></select></label>
  <p class="result-count" id="resultCount" role="status"></p><div class="poem-list" id="poemList"></div>
</dialog>
<dialog id="settings" class="sheet settings-sheet" aria-labelledby="settingsTitle">
  <div class="sheet-header"><div><span class="library-kicker">依你的习惯</span><h2 id="settingsTitle">阅读设置</h2></div><button class="icon-button" data-close="settings" aria-label="关闭设置">×</button></div>
  <label class="setting-row"><span>显示简注</span><input type="checkbox" id="settingNotes" role="switch" /></label>
  <label class="setting-row"><span>诗文字号</span><select id="fontSize"><option value="20">小</option><option value="22">标准</option><option value="26">大</option><option value="30">特大</option></select></label>
  <fieldset class="paper-picker"><legend>纸色</legend><label><input type="radio" name="paper" value="warm" />暖纸</label><label><input type="radio" name="paper" value="ivory" />素白</label><label><input type="radio" name="paper" value="sage" />青笺</label></fieldset>
  <button class="setting-row setting-link" id="manageFavorites"><span>我的收藏</span><span id="favoriteCount">0 首 ›</span></button>
  <div class="about"><h3>唐诗三百首 · 诗画笺</h3><p>一页一诗，一诗一画。</p><p>阅读位置、收藏与设置仅保存在当前设备。无需账号，无广告、无统计追踪。</p><p>诗文按选本书序整理，部分题名保留常用别名。文字与简注持续校订。版本 0.3</p></div>
</dialog>
<dialog id="notesDialog" class="sheet" aria-labelledby="notesTitle"><div class="sheet-header"><h2 id="notesTitle">诗意与注释</h2><button class="icon-button" data-close="notesDialog" aria-label="关闭注释">×</button></div><div id="fullNotes" class="full-notes"></div></dialog>
<noscript>请开启 JavaScript 后阅读诗笺。</noscript>
<script type="module" src="./app.js?v=0.3.2"></script>
</body>
</html>
