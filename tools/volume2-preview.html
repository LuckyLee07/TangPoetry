<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二卷 · 诗意与画笺</title>
<style>
:root{color-scheme:light;--ink:#373930;--muted:#74786b;--paper:#f5efe2;--accent:#9e4934}*{box-sizing:border-box}body{margin:0;background:#e8e9e2;color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:22px 30px;background:#faf8f1;border-bottom:1px solid #d9dccf;display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font:25px/1.5 "Songti SC",serif;margin:0}small,.muted{color:var(--muted);font-size:13px}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid #c8ccb9;background:#f9f8f0;border-radius:8px;padding:8px 13px}button{cursor:pointer}button:hover{background:#e7eadf}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.layout{max-width:1440px;margin:24px auto;display:grid;grid-template-columns:250px minmax(340px,440px) minmax(300px,1fr);gap:30px;padding:0 24px}.library{height:calc(100vh - 148px);position:sticky;top:24px;display:flex;flex-direction:column;gap:10px}.library input{width:100%}.items{overflow:auto;min-height:0}.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 7px;padding:8px;background:#f6f6ee;border:1px solid transparent}.item[aria-current=true]{border-color:#9ca78f;background:#fffdf3}.thumb{width:48px;height:48px;object-fit:cover;object-position:50% 10%;border-radius:6px;flex:none}.item span{display:block;line-height:1.4;font-size:14px}.item small{font-size:12px}.page{aspect-ratio:9/16;width:100%;background:var(--paper);background-size:100% 100%;position:relative;box-shadow:0 8px 32px #414a3820;border-radius:10px;overflow:hidden}.poetry{position:absolute;top:35%;left:6%;right:6%;bottom:22%;text-align:center;overflow:auto;scrollbar-width:thin}.poetry h2{font:26px/1.4 "Songti SC",serif;margin:0 0 3px}.author{font-size:13px;color:#888978;margin:0 0 15px}.lines{font:23px/1.9 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:2px}.page.long .lines{font-size:19px;line-height:1.8;letter-spacing:1px}.page.long h2{font-size:22px}.page.quatrain .poetry{top:42%}.short-meaning{position:absolute;top:81%;left:8%;right:8%;font-size:13px;line-height:1.7;color:#696b60;border-top:1px solid #9b9c8240;padding-top:9px;max-height:15%;overflow:auto}.page-status{position:absolute;left:14px;top:13px;font-size:11px;color:#565f4d;background:#fffc;padding:3px 8px;border-radius:30px}.navigation{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.notes{padding:12px 0}.notes h2{font:25px/1.5 "Songti SC",serif;margin:0 0 4px}.notes h3{font-size:14px;font-weight:600;margin:25px 0 8px;color:#5d6856}.notes p{margin:0 0 14px}.notes .summary{font-size:18px}.glossary{font-size:14px}.glossary dt{font-weight:600;display:inline}.glossary dd{margin:0 0 10px}.review{font-size:13px;background:#f6f4e9;border:1px solid #d5d6c8;padding:12px;border-radius:8px}.review p{margin:8px 0}a{color:#69774e}.switches{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.error{color:#9b3228;padding:40px}#empty{padding:10px;color:#777}details summary{cursor:pointer}@media(max-width:1050px){.layout{grid-template-columns:210px minmax(320px,440px);justify-content:center}.notes{grid-column:2}.library{grid-row:1/3}}@media(max-width:650px){header{padding:15px 18px;display:block}header small{display:block}.layout{display:block;padding:0 16px;margin:16px auto;max-width:470px}.library{height:auto;position:static;margin-bottom:16px}.items{max-height:170px;display:none}.library:focus-within .items{display:block}.page{width:100%}.notes{padding:8px 4px}.switches{margin-top:8px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
<header><div><h1>唐诗画笺 · 第二卷</h1><small id="stats">载入诗意与插画…</small></div><div class="switches"><label><input type="checkbox" id="words" checked> 显示诗文</label><label><input type="checkbox" id="onlyArt"> 仅看有图</label><a href="../data/expansion/tang-second-volume/EDITORIAL_NOTES.md" target="_blank">校勘笔记</a></div></header>
<main class="layout"><aside class="library"><input type="search" id="search" placeholder="搜诗题、作者或诗句" aria-label="搜索诗词"><select id="genre" aria-label="按体裁筛选"><option value="">全部体裁</option></select><div class="items" id="items"></div></aside><section><div class="page" id="page"><div class="page-status" id="pageStatus"></div><div class="poetry" id="poetry"><h2 id="title"></h2><div class="author" id="author"></div><div class="lines" id="lines"></div></div><div class="short-meaning" id="shortMeaning"></div></div><nav class="navigation"><button id="previous" aria-label="上一首">← 上一首</button><small id="count"></small><button id="next" aria-label="下一首">下一首 →</button></nav><small>第二卷独立内容预览 · 长诗可在诗文区域滚动</small></section><article class="notes" id="notes"></article></main>
<script>
'use strict';
const $=id=>document.getElementById(id),base='../';let all=[],filtered=[],current=null;
const el=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n};
function genre(p){return p.form.proposedGenre||p.form.metricalShape||'其他'}
function filter(){const q=$('search').value.trim();filtered=all.filter(p=>(!q||[p.title,p.author,p.text].some(s=>s.includes(q)))&&(!$('genre').value||genre(p)===$('genre').value)&&(!$('onlyArt').checked||p.image));$('items').replaceChildren();for(const p of filtered){const b=el('button','', 'item');b.type='button';b.setAttribute('aria-current',String(p===current));b.dataset.order=p.order;if(p.image){const img=document.createElement('img');img.src=base+p.image;img.className='thumb';img.loading='lazy';img.alt='';b.append(img)}const text=el('div','');text.append(el('span',p.title),el('small',p.author+' · '+String(p.order).padStart(3,'0')));b.append(text);b.onclick=()=>show(p);$('items').append(b)}if(!filtered.length)$('items').append(el('div','没有匹配的诗篇','muted'));if(filtered.length&&!filtered.includes(current))show(filtered[0]);else navigation();}
function navigation(){const i=filtered.indexOf(current);$('previous').disabled=i<=0;$('next').disabled=i<0||i>=filtered.length-1;$('count').textContent=i<0?'0 / 0':(i+1)+' / '+filtered.length;}
function show(p){current=p;history.replaceState(null,'','#'+p.order);document.title=p.title+' · 第二卷';const page=$('page'),long=p.sentences.length>8;page.className='page'+(long?' long':'')+(p.sentences.length===4?' quatrain':'');page.style.backgroundImage=p.image?'url("'+base+p.image+'")':'none';$('pageStatus').textContent=genre(p)+(p.image?'':' · 插画制作中');$('title').textContent=p.title;$('author').textContent=p.dynasty+' · '+p.author;$('lines').replaceChildren(...p.sentences.map(s=>el('div',s)));$('poetry').scrollTop=0;$('shortMeaning').textContent=p.commentary.summary;const c=p.commentary,n=$('notes');n.replaceChildren(el('h2',p.title),el('small',p.author+' · '+genre(p)+' · 编辑初稿'),el('h3','诗意'),el('p',c.summary,'summary'),el('h3','分段解读'));n.append(...c.interpretation.map(s=>el('p',s)));n.append(el('h3','字词小注'));const dl=el('dl','','glossary');for(const g of c.glossary)dl.append(el('dt',g.term),el('dd',g.text));n.append(dl);if(c.reviewNotes.length){const d=el('details','','review');d.append(el('summary','版本与释义笔记（'+c.reviewNotes.length+'）'),...c.reviewNotes.map(s=>el('p',s)));n.append(d)}const refs=[...new Set([...(c.basis.verificationRefs||[]),...c.basis.sourceRefs])];n.append(el('h3','整理依据'));for(const [i,url]of refs.entries()){const a=el('a','来源 '+(i+1));a.href=url;a.target='_blank';a.rel='noopener';n.append(a,document.createTextNode('　'))}if(p.image){n.append(el('h3','插画'));const a=el('a','查看完整原图');a.href=base+p.image;a.target='_blank';n.append(a)}document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.order===p.order)));navigation();}
$('search').oninput=filter;$('genre').onchange=filter;$('onlyArt').onchange=filter;$('words').onchange=()=>{for(const id of ['poetry','shortMeaning'])$(id).hidden=!$('words').checked};$('previous').onclick=()=>show(filtered[filtered.indexOf(current)-1]);$('next').onclick=()=>show(filtered[filtered.indexOf(current)+1]);document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('previous').disabled)$('previous').click()});
fetch('../data/expansion/tang-second-volume/production.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('数据读取失败');return r.json()}).then(d=>{all=d.poems;$('stats').textContent=all.length+' 首诗意 · '+all.filter(p=>p.image).length+' 幅画笺 · 独立制作稿';for(const g of [...new Set(all.map(genre))]){const o=el('option',g);o.value=g;$('genre').append(o)}current=all.find(p=>p.order===+location.hash.slice(1))||all[0];filter();show(current)}).catch(e=>{$('stats').textContent=e.message;});
</script></html>
